<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Yahweh’s Words · Google sign-in</title>
  <link rel="stylesheet" href="/desktop-google-sign-in.css">
  <script type="module" src="/desktop-google-sign-in.js"></script>
</head>
<body>
  <main>
    <div class="brand">Yahweh’s Words</div>
    <label class="language"><span aria-hidden="true">◎</span><select id="language" aria-label="Language"><option value="en">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option></select></label>
    <h1 id="title">Sign in with Google</h1>
    <p id="intro">Continue securely in your browser, then return to the Windows app.</p>
    <p id="status" role="status" aria-live="polite">Checking your sign-in request…</p>
    <button id="continue" disabled>Continue with Google</button>
    <button id="cancel" class="secondary" disabled>Cancel</button>
    <p id="privacy" class="fine">This uses your Google account name and email to sign in and sync your own data. No Google Drive access is requested.</p>
  </main>
</body>
</html>
