# Yahweh's Words — Microsoft Store package (MSIX)
#
# Manual only. Builds the Windows app and packs an unsigned .msix for
# upload to Partner Center (Microsoft signs Store packages). It touches
# no release and no tag. The version comes from pubspec `version`
# (msix turns 1.6.30+N into 1.6.30.0, which the Store requires).
# STORE_BUILD switches off the GitHub self-updater. Identity/publisher values live in pubspec.yaml
# under msix_config. Download the artifact, then upload it in Partner
# Center → the app → Submission → Packages.
name: Windows Store MSIX

on:
  workflow_dispatch:
    inputs:
      send_to_store:
        description: 'Create a Partner Center submission with this MSIX (needs the MS_STORE_* secrets). Off = artifact only.'
        type: boolean
        default: false
      commit_submission:
        description: 'Also send it to certification. Off = leaves an uncommitted draft submission you finish in Partner Center.'
        type: boolean
        default: false

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'   # keep in step with release-windows.yml
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=STORE_BUILD=true
      - name: Pack MSIX (Store)
        shell: bash
        run: |
          dart run msix:create --store --build-windows false
          find build -name '*.msix'
      - uses: actions/upload-artifact@v7
        with:
          name: Yahwehs-Words-msix
          path: build/windows/x64/runner/Release/*.msix
          if-no-files-found: error

      # Optional store push. Needs the checkbox AND the four secrets below.
      # Product id 9NVJ28XSKP67 is this app's Store id. Without
      # commit_submission the submission stays a draft in Partner Center.
      - name: Install Microsoft Store CLI
        if: ${{ inputs.send_to_store }}
        uses: microsoft/setup-msstore-cli@v1
      - name: Publish to Partner Center
        if: ${{ inputs.send_to_store }}
        shell: bash
        env:
          MS_TENANT: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_CLIENT: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_SELLER: ${{ secrets.MS_STORE_SELLER_ID }}
        run: |
          msstore reconfigure --tenantId "$MS_TENANT" --clientId "$MS_CLIENT" --clientSecret "$MS_SECRET" --sellerId "$MS_SELLER"
          pkg="$(find build/windows/x64/runner/Release -name '*.msix' | head -1)"
          flag=""
          [ "${{ inputs.commit_submission }}" = "true" ] || flag="--noCommit"
          msstore publish "$pkg" --appId 9NVJ28XSKP67 $flag
