# YsWords — Flutter CI
#
# 2026-05-24 (v1.3.22): catches regressions before they ship to prod.
# Pre-fix the only quality gate was the developer remembering to run
# `flutter analyze && flutter test` locally before pushing. With the
# error monitor live (v1.3.21) we'd at least *see* a runtime crash,
# but a build that fails analysis or breaks an existing test was
# completely invisible until the next manual run.
#
# Triggers
#   * Every push to main (the deploy branch — Netlify CLI deploys
#     happen from a contributor's machine, not Netlify's git linkage,
#     so this workflow is the only automated check between commit
#     and prod)
#   * Every PR targeting main
#
# Steps
#   1. Checkout
#   2. Setup Flutter (pinned to the version in pubspec — bump here
#      and in the dev environment together)
#   3. Cache the pub cache + .dart_tool so subsequent runs are fast
#   4. flutter pub get
#   5. flutter analyze — fail on any new analysis issues. The
#      3 pre-existing settings_page infos are tolerated (counted +
#      compared; any new finding fails the build)
#   6. flutter test — the whole suite must pass. This comment used to
#      pin a "109/109" count; that was stale (May 2026) and, as of
#      2026-09-15, coincided with an unrelated chronology test file
#      that happens to also have 109 tests — misleading, not current.
#      The gate is "no failing or skipped test", not a specific count.
#
# Runs on ubuntu-latest. iOS / macOS / Android builds are NOT
# exercised here — they're built daily by the local launchd job
# (tools/yswords-ios-reinstall.sh) which catches platform-
# specific build failures (CocoaPods, NDK, Gradle).
name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 2026-06-16: full history (not the default depth-1 shallow clone).
          # The Gitleaks step scans the push's commit RANGE (before^..after).
          # On a multi-commit push the base SHA isn't present in a shallow
          # checkout, so gitleaks died with `fatal: ambiguous argument
          # '<sha>^..<sha>': unknown revision` → exit 1 (a CI failure with
          # ZERO leaks found). fetch-depth: 0 gives it the history it needs.
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to the Flutter version the local dev env uses
          # (the canonical install at /Users/pliu0036/flutter is
          # 3.44.2 per the README badge). Bump here when the
          # local toolchain bumps.
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      # 2026-08-10: retried. A run failed with `Authentication error
      # (403)` raised from HostedSource._fetchAdvisories — pub.dev's
      # security-advisory endpoint, queried *after* the dependency
      # solve had already succeeded. Nothing to do with our pubspec,
      # and it cleared on its own. Three tries with a short backoff
      # turn that class of upstream blip into a slower green run
      # rather than a red one someone has to re-run by hand.
      - name: Pub get
        run: |
          for attempt in 1 2 3; do
            if flutter pub get; then exit 0; fi
            echo "pub get failed (attempt $attempt/3) — retrying in 15s"
            sleep 15
          done
          echo "pub get failed three times; not a transient blip"
          exit 1

      - name: Analyze
        # v1.3.25: --no-fatal-infos REMOVED. The 2 pre-existing
        # settings_page `use_build_context_synchronously` infos were
        # closed by capturing ScaffoldMessenger before the await,
        # so flutter analyze now exits 0 cleanly. From this point
        # forward CI fails on ANY new info-level finding — strictest
        # quality gate.
        run: flutter analyze

      # 2026-08-25: apk_freshness_guard_test.dart lifts functions out of
      # tools/yswords-ios-reinstall.sh and executes them under `zsh` —
      # deliberately, because zsh is that script's own `#!` line and a
      # guard exercised under a different interpreter is a guard nobody
      # has actually tested. ubuntu-latest ships bash and dash but NOT
      # zsh, so seven of those tests died with "ProcessException: No such
      # file or directory" while passing on the macOS that wrote them.
      #
      # This is the same blind spot that let CI stay red for six hours:
      # every local signal was green because the developer's machine had
      # what the runner lacked. Installing the interpreter is the honest
      # fix; making the test fall back to `sh` would have made it green
      # by testing something the script never runs.
      - name: Install zsh (the reinstall guard's own interpreter)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh
          zsh --version

      # The boot splash picks the app's name by locale, in browser
      # JavaScript inside web/index.html. `flutter test` can assert that
      # code is present; it cannot tell you that `zh-TW` resolves to
      # 雅偉之言 or that a JSON-quoted stored preference is unwrapped. This
      # runs the real extracted function against both.
      #
      # It is also the file's syntax gate. This repo has already shipped a
      # stray brace in an inline <script> that silently disabled the
      # whole self-heal script on four live sites — nothing failed, it
      # just stopped working.
      - name: Boot splash locale logic
        run: node tools/check_boot_splash_locale.js

      # The rules that decide whether a stuck splash throws away an
      # in-flight 10 MB download and reloads itself. Wrong in the
      # permissive direction and a slow phone reloads forever, each
      # attempt discarding the bytes of the last; wrong in the strict
      # direction and the user stares at the dead splash this exists to
      # fix. Neither shows up on a fast connection.
      - name: Boot splash auto-recovery logic
        run: node tools/check_boot_autorecover.js

      # P0 scripture-accuracy census (tools/audit_p0.py), read-only,
      # committed assets only, no network. Filed 2026-09-07: the script
      # existed but nothing ran it, so a regression in sermon-locale file
      # parity or in the tagged word-tap corpus's Strong's-code format
      # would only be found by someone remembering to run it by hand.
      # `--check` asserts invariants (zh-TW/zh-CN file-count parity;
      # every tagged Strong's code matches [GH]\d+), not frozen counts —
      # a hardcoded total would turn CI red the next time a sermon is
      # legitimately added. `tools/audit_originals_compounds.py`'s own
      # `--check` is NOT here: it never fetches — it SKIPS (exit 0) if
      # `.cache/originals/` isn't already warm, which on a bare runner is
      # always. Wiring it in would be a step that always passes vacuously,
      # and warming the cache would reintroduce the cold network fetch
      # commit 04cbdcdd deliberately removed from this CI. It stays a
      # local pre-release check.
      - name: P0 sermon/tagged-corpus invariants
        run: python3 tools/audit_p0.py --check

      # Unit tests for the gate above (test/test_audit_p0_check.py), added
      # 2026-09-08. Deliberately NOT `python3 -m unittest discover test`:
      # most files under test/ load gitignored, locally-staged corpora and
      # were the cause of a prior CI-red/local-green split (see that
      # file's own comment). This one file is pure tempdirs, no assets, so
      # it is safe to run unconditionally.
      - name: P0 audit gate unit tests
        run: python3 test/test_audit_p0_check.py

      # Same reasoning as the step above: pure-function fixtures, no assets,
      # safe unconditionally. Pins the 2026-09-09 fix where an EXPLAINED/
      # PENDING id moving from `running` into `apparatus` (apparatus_mask
      # learning a new marker spelling) got misreported as "no longer reads
      # long" by both audit_inserted_characters.py and audit_dropped_characters.py.
      - name: inserted/dropped-character audit unit tests
        run: python3 test/test_stale_known_ids.py

      # Strong's-tagging census (tools/audit_strongs_tagging.py), read-only.
      # Filed 2026-09-08: the tool backs docs/autonomous-queue.md:7553's P1
      # tick, but nothing pinned its totals, so 38 corpus edits drifted the
      # figures quoted there silently for weeks (367,589 -> 367,572 runs,
      # unnoticed until this iteration re-ran it and diffed by hand). Unlike
      # audit_p0.py's `--check` above, this one DOES pin raw totals — a
      # deliberate ratchet in the style of test/strongs_alignment_test.dart's
      # singleton-pair count, not an invariant true by construction. Any
      # legitimate repair moves these numbers; the fix is to re-derive and
      # bump `PINNED` in the same commit, explaining the delta, not to loosen
      # the check.
      - name: Strong's-tagging census totals
        run: python3 tools/audit_strongs_tagging.py --check

      # Divine-name census (tools/audit_divine_name.py), read-only. Landed
      # 2026-09-14 (7515073f) with a `--check` mode documented for CI, but
      # never actually wired into any workflow until now. Same shape as the
      # Strong's-tagging gate above: pins raw totals over
      # assets/tagged/cuvs-yhwh/ (agree/disagree_h3068/neither/unresolved,
      # plus the TSV reconciliation), a ratchet rather than an invariant
      # true by construction. A legitimate future sweep of the remaining
      # disagree_h3068 verses moves these numbers; the fix is to re-derive
      # and bump PINNED in tools/audit_divine_name.py in the same commit,
      # explaining the delta, not to loosen the check. All inputs
      # (assets/tagged/cuvs-yhwh/, assets/originals/, both
      # originals_versification*.json, tools/cuv-2026-09-12-divine-name-
      # audit.tsv) are tracked and committed, so — unlike
      # audit_originals_compounds.py above — this runs offline on a bare
      # runner with nothing to warm.
      - name: Divine-name census totals
        run: python3 tools/audit_divine_name.py --check

      # Unit tests for the two gates directly above (added 2026-09-16):
      # neither audit_strongs_tagging.py's nor audit_divine_name.py's
      # check() had a test of its own, unlike audit_p0.py's (the step at
      # :163). Both stub census()/reconcile()/_compute() with synthetic
      # dicts rather than re-walking the real corpus (367,573 runs), so
      # this proves the COMPARISON logic — the part CI's steps above
      # cannot exercise, since the real corpus always passes them by
      # construction of `PINNED` being kept in sync with it. Pure
      # in-memory fixtures, no assets, safe unconditionally, same
      # reasoning as :163's own comment.
      - name: Strong's-tagging / divine-name gate unit tests
        run: python3 test/test_audit_census_checks.py

      # Unit tests for tools/import_ljk2.py's build_book_verses(), added
      # 2026-09-14/2026-09-24 (test_import_ljk2_split_block_comment.py,
      # test_import_ljk2_comment_list.py, test_import_ljk2_empty_verse_index.py)
      # but never wired into CI until now. Same reasoning as :163's own
      # comment: pure fixtures fed through build_book_verses() with no
      # assets and no network, so safe unconditionally. Each pins a node
      # shape the importer previously dropped silently — a stray
      # `comment` body read as a footnote, a whole comment-list, an
      # empty-verseIndex verse node — so a future edit that reintroduces
      # any of those silent drops fails here instead of shipping.
      - name: import_ljk2 unit tests
        run: |
          python3 test/test_import_ljk2_split_block_comment.py
          python3 test/test_import_ljk2_comment_list.py
          python3 test/test_import_ljk2_empty_verse_index.py

      # 路加福音 23:34a invariant (tools/repair_biblexg_luke_23_34a.py),
      # added 2026-09-24. The September re-fetch (biblexg-v3 / -v3-tr,
      # which superseded and hid biblexg-v2*) dropped the affix from 23:33
      # but never split 34a back out of 23:34, silently regressing the
      # 2026-09-02 feature (「34a这些能够也做成像经文可以选择的节吗」) on the
      # editions readers actually get — nothing caught it because this
      # gate didn't exist and test/luke_23_34a_test.dart's `editions` map
      # only ever listed the two hidden v2 paths. `--check` never writes;
      # it refuses (exit 1) if any of the four editions is neither
      # correctly split nor provably unsplit-and-splittable, which is
      # exactly the half-applied shape that regression left behind.
      - name: 路加福音 23:34a sub-verse invariant
        run: python3 tools/repair_biblexg_luke_23_34a.py --check

      # Unit tests for the fourth and last `--check` gate without one
      # (added 2026-09-16): tools/audit_originals_compounds.py's --check
      # exits 0 on both "no drift" and "cache is cold, nothing measured"
      # — this pins that those two paths are actually distinguishable, by
      # stubbing cache_ready()/hebrew_drift()/greek_drift() rather than
      # touching .cache/originals/. The gate itself stays out of CI (see
      # the P0 step's comment above); this test file is safe here because
      # it never warms or reads that cache at all.
      - name: Originals-compounds audit gate unit tests
        run: python3 test/test_audit_compounds_check.py

      # Unit tests for tools/audit_songs_snapshot_churn.py's pure
      # split_song_changes()/restamped_to_generated_at() functions (added
      # 2026-09-16). The tool itself stays out of CI — it shells out to
      # `git log`/`git show` over assets/songs.json's history, which a
      # bare checkout is not guaranteed to have — but this test file uses
      # only synthetic in-memory fixtures (never assets/songs.json, never
      # git), so it is safe unconditionally on a bare runner.
      - name: Songs-snapshot-churn audit unit tests
        run: python3 test/test_audit_songs_snapshot_churn.py

      # Unit tests for tools/audit_quote_bracket_style.py's pure
      # scan_book()/per_verse_mismatches()/span_mark_totals()/
      # group_by_book() functions (added 2026-09-22, queue:9248's wider
      # scan). Like audit_tagged_quote_balance.py and
      # audit_speaker_attribution.py — its two closest siblings, both over
      # the same two frozen assets — the tool itself stays out of CI; only
      # this test file is wired in. Synthetic fixtures only: never
      # assets/cuvs-yhwh*.json, never the tagged corpus, never the
      # `7a2dc43` witness blob, so this is safe unconditionally.
      - name: Quote-bracket-style audit unit tests
        run: python3 test/test_audit_quote_bracket_style.py

      # Unit tests for scripts/push_songs_snapshot.py (added 2026-09-20,
      # fixing the sync-songs.yml push race — see that script's own
      # comment for the incident). Safe on a bare runner: every test
      # builds its own bare remote + clones under a
      # tempfile.TemporaryDirectory(), synthetic git repos only, never
      # this checkout and never the network.
      - name: Songs-sync push-retry unit tests
        run: python3 test/test_push_songs_snapshot.py

      # Unit tests for scripts/pull_songs_snapshot.py's evaluate() — the
      # sibling of the push-retry gate above, existed since the
      # 2026-09-04..07 incident (see the file's own docstring) but was
      # never wired into any workflow. Pure fixtures only, no network,
      # no filesystem beyond the module import — safe unconditionally.
      - name: Songs-snapshot pull-guard unit tests
        run: python3 test/test_pull_songs_snapshot.py

      # Structural gate for tools/queue_open_items.py (added 2026-09-21).
      # docs/autonomous-queue.md keeps closed-out write-ups as kept records
      # inside <details> blocks, checkbox left unticked on purpose (the
      # live outcome is a separate [x] entry above the block, not an edit
      # to the archived text). A planning pass that just greps `- [ ]`
      # can't tell the two apart, and it has dispatched real hours of work
      # against an archived copy twice — see queue:14240 and queue:14256
      # for both incidents. `--check` only asserts the file's <details>
      # tags balance to depth 0; see the tool's own docstring for why a
      # naive "line contains <details>" counter is the wrong check (eight
      # backticked prose mentions of the tag would misread as structural).
      - name: Queue open-items structural check
        run: python3 tools/queue_open_items.py --check

      - name: Queue open-items parser unit tests
        run: python3 test/test_queue_open_items.py

      # Coverage gate for tools/run_test_chunks.py (added 2026-09-21, see
      # queue:19259). This is a local/loop foreground-chunking tool, not a
      # CI replacement — it never replaces the whole-suite `flutter test`
      # step below. `--check` only asserts the partition covers every
      # discovered test file exactly once, with no duplicates and no
      # empty chunk; no `flutter` invocation needed, so it's a cheap gate.
      - name: Test-chunk partition coverage check
        run: python3 tools/run_test_chunks.py --check

      - name: Test-chunk partitioner unit tests
        run: python3 test/test_run_test_chunks.py

      # 2026-09-22: pre-place PDFium's native asset before `flutter test`
      # triggers its build hook. Run 35614939558 failed the whole suite
      # before a single test ran, with `Failed to download PDFium: ...
      # pdfium-linux-x64.tgz` — pdfium_dart 0.2.5's hook/build.dart does ONE
      # unretried `http.Client().get()` for that tgz (hook/build.dart:52-55)
      # and throws on any non-200. The release still had the asset when
      # checked the same day via the GitHub API, and the failing commit was
      # docs-only with a green parent on the same tree — an upstream blip,
      # not a deletion, and the first failure in the last 100 runs of this
      # workflow.
      #
      # The hook's own guard, `if (await output.exists()) return;`
      # (hook/build.dart:45), makes the download a no-op once the file is
      # there. `input.outputDirectoryShared` resolves to
      # `.dart_tool/hooks_runner/shared/pdfium_dart/build/` — confirmed
      # against this repo's own local tree — under
      # `chromium_7811/linux-x64/libpdfium.so` for this runner's target
      # (hook/build.dart:17-19, 108-113). Nothing in this workflow caches
      # `.dart_tool` between runs, so this step re-fetches every run same as
      # the hook would; the only difference is retry.
      #
      # The release tag `chromium/7811` is hardcoded per pdfium_dart version,
      # not derived from pubspec.lock, so it goes stale the moment
      # pdfium_dart is bumped past 0.2.5. The version check below turns that
      # into a loud skip (the hook's own unretried download still runs)
      # rather than a silent no-op or a break of its own — whoever bumps the
      # dependency needs to re-derive the tag and update this step, not
      # have CI quietly stop protecting against this blip.
      - name: Pre-place PDFium native asset (retry the upstream download)
        run: |
          set -e
          LOCKED=$(awk '/^  pdfium_dart:$/{f=1} f==1 && /^    version:/{print; exit}' pubspec.lock | sed -E 's/.*"(.*)".*/\1/')
          if [ "$LOCKED" != "0.2.5" ]; then
            echo "::warning::pdfium_dart is locked at '$LOCKED', not the 0.2.5 this step was written for (release tag chromium/7811 is hardcoded per-version in the hook). Skipping pre-place; the hook's own unretried download will run instead."
            exit 0
          fi
          DEST_DIR=".dart_tool/hooks_runner/shared/pdfium_dart/build/chromium_7811/linux-x64"
          DEST="$DEST_DIR/libpdfium.so"
          mkdir -p "$DEST_DIR"
          TMP=$(mktemp -d)
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$TMP/pdfium-linux-x64.tgz" \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz"
          tar -xzf "$TMP/pdfium-linux-x64.tgz" -C "$TMP" lib/libpdfium.so
          mv "$TMP/lib/libpdfium.so" "$DEST"
          rm -rf "$TMP"
          echo "Pre-placed $DEST"

      - name: Test
        run: flutter test --reporter expanded

      # 2026-05-24 (v1.3.24): gitleaks secret scan. Catches an
      # accidental commit of GEMINI_API_KEY, RESEND_API_KEY, AWS
      # creds, Firebase service-account JSONs, etc. before they
      # land on origin/main. Runs against the whole repo on push
      # + only the PR diff on pull_request (faster). The local
      # git-secrets hook is broken per memory's env-quirks; this
      # is the only reliable secret gate.
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
