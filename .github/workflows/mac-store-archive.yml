name: Mac Store archive (unsigned CI artifact)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1.7.17
      - name: Record source and installed tools
        run: |
          git rev-parse HEAD
          xcodebuild -version
          xcodebuild -showsdks
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Configure store runtime without moving signing credentials
        run: flutter build macos --config-only --release --build-name=1.7.17 --build-number=1070017 --dart-define=STORE_BUILD=true
      - name: Archive universal macOS11 app without signing on runner
        run: |
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=macOS' 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=11.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -archivePath "$RUNNER_TEMP/Words-Mac-1.7.17.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/MacStore-DD" -jobs 2 archive
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Words-Mac-1.7.17.xcarchive" "$RUNNER_TEMP/Words-Mac-1.7.17-unsigned-archive.zip"
          shasum -a 256 "$RUNNER_TEMP/Words-Mac-1.7.17-unsigned-archive.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: Words-Mac-1.7.17-store-unsigned-archive
          path: ${{ runner.temp }}/Words-Mac-1.7.17-unsigned-archive.zip
          if-no-files-found: error
          compression-level: 0
