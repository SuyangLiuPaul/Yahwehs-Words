name: Store API preflight
on:
  workflow_dispatch:
    inputs:
      submit_ms_1717:
        description: Submit only the already verified existing 1.7.17 Microsoft draft for review
        type: boolean
        default: false
      verify_staged_1717:
        description: Read only the existing 1.7.17 Microsoft staged ZIP
        type: boolean
        default: false
# Same service account may have only one active Play edit per app.
concurrency:
  group: store-play-edit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  credentials:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install google-auth requests
      - name: Upload guards
        run: python tools/test_store_upload_guards.py
      - name: Google Play access and existing tracks
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python tools/play_store_preflight.py
      - name: Microsoft access and pending submission
        if: always()
        env:
          MS_TENANT: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_CLIENT: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: |
          if [ '${{ inputs.submit_ms_1717 }}' = 'true' ]; then
            python tools/windows_store_commit_existing.py --submit-for-review
          else
            python tools/windows_store_guard.py --check-only ${{ inputs.verify_staged_1717 && '--verify-staged' || '' }}
          fi
